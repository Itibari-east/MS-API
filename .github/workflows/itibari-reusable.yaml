name: Itibari Reusable Playwright Runner

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ""
      grep:
        type: string
        required: false
        default: ""
      moduleName:
        type: string
        required: true
      moduleSlug:
        type: string
        required: true
      shardIndex:
        type: string
        required: true
      shardTotal:
        type: string
        required: true
      environment:
        type: string
        required: true
      use-cache:
        type: boolean
        default: true
      node-version:
        type: string
        default: "20"
    secrets:
      MS_USER_EMAIL:
        required: true
      MS_USER_PASSWORD:
        required: true
      MS_TOTP_SECRET:
        required: true
      MS_DEV_BASE_URL:
        required: true
      GMAIL_CLIENT_ID:
        required: false
      GMAIL_CLIENT_SECRET:
        required: false
      GMAIL_TEST_EMAIL:
        required: false
      GMAIL_REFRESH_TOKEN:
        required: false
      GMAIL_ACCESS_TOKEN:
        required: false

jobs:
  run-playwright-tests:
    name: ${{ inputs.moduleName }} - Shard ${{ inputs.shardIndex }}/${{ inputs.shardTotal }}
    runs-on: ubuntu-latest

    env:
      CI: true
      ENVIRONMENT: ${{ inputs.environment }}
      MS_USER_EMAIL: ${{ secrets.MS_USER_EMAIL }}
      MS_USER_PASSWORD: ${{ secrets.MS_USER_PASSWORD }}
      MS_TOTP_SECRET: ${{ secrets.MS_TOTP_SECRET }}
      MS_DEV_BASE_URL: ${{ secrets.MS_DEV_BASE_URL }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_TEST_EMAIL: ${{ secrets.GMAIL_TEST_EMAIL }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_ACCESS_TOKEN: ${{ secrets.GMAIL_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright API tests
        id: playwright
        continue-on-error: true
        env:
          GREP_FILTER: ${{ inputs.grep }}
          TAG_FILTER: ${{ inputs.tag }}
        run: |
          if [ -n "$GREP_FILTER" ]; then
            npx playwright test --grep "$GREP_FILTER" --pass-with-no-tests --shard=${{ inputs.shardIndex }}/${{ inputs.shardTotal }}
          elif [ -n "$TAG_FILTER" ]; then
            npx playwright test --grep "$TAG_FILTER" --shard=${{ inputs.shardIndex }}/${{ inputs.shardTotal }}
          else
            npx playwright test --shard=${{ inputs.shardIndex }}/${{ inputs.shardTotal }}
          fi

      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ inputs.moduleSlug }}-${{ inputs.shardIndex }}
          path: |
            blob-report/
            test-results/
          if-no-files-found: warn

      - name: Fail workflow if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
